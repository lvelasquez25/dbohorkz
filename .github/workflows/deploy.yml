# Despliega automáticamente en el VPS de Hostinger cada vez que algo llega a main.
# Requiere el secreto VPS_SSH_KEY (ver DEPLOY_HOSTINGER.md, sección "Despliegue automático").
name: Desplegar en VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: 179.197.89.184
  # Huella pública del servidor (ssh-keyscan -t ed25519 179.197.89.184)
  VPS_KNOWN_HOST: 179.197.89.184 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOYpSTW0VRhUavFVn+JvlXaebfBEw/AnTypteQB3fmju

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configurar llave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      # La llave solo puede ejecutar deploy/deploy.sh en el servidor (comando forzado)
      - name: Desplegar
        run: ssh -o ServerAliveInterval=30 root@"$VPS_HOST"

      - name: Verificar que la tienda responde
        run: |
          for i in $(seq 1 18); do
            if curl -fsS --max-time 10 https://api.dbohorkz.com/api/health \
               && curl -fsS --max-time 10 -o /dev/null https://dbohorkz.com; then
              echo "Tienda OK"; exit 0
            fi
            echo "Esperando... ($i)"; sleep 10
          done
          echo "La tienda no responde después del despliegue"; exit 1
